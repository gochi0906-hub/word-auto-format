<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文書体裁 自動整形</title>
  <link rel="stylesheet" href="./taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img class="logo" src="./assets/logo-filled.png" alt="logo" />
      <div class="title">表記整形</div>
    </div>

    <div class="card">
      <div class="steps">
        <div>① Word本文で整形したい文字をドラッグで選択</div>
        <div>② 下の青いボタンを押す</div>
      </div>

      <button id="runBtn" class="btn">
        <span class="spark">✨</span>
        <span class="btnText">選択範囲を整形</span>
        <div class="btnSub">全角英数字→半角 / 半角ｶﾅ→全角 / ｰ→ー</div>
      </button>

      <div id="status" class="status"></div>

      <details class="details">
        <summary>整形ルール（詳細）</summary>
        <ul>
          <li>全角英数字 → 半角英数字</li>
          <li>半角カナ → 全角カナ</li>
          <li>半角ハイフン/長音っぽい記号（ｰ 等）→ 全角長音（ー）</li>
        </ul>
      </details>
    </div>

    <div class="footer">
      <small>Tokyo JC / Word Add-in</small>
    </div>
  </div>

  <script src="./taskpane.js"></script>
</body>
</html>
