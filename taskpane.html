<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Formatter</title>

  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <link
    rel="stylesheet"
    href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"
  />
  <link href="taskpane.css" rel="stylesheet" type="text/css" />

  <style>
    /* “押す場所がわかる”最優先の見た目 */
    .primary-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 12px;
      background: #2563eb; /* 青 */
      color: #fff;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      transition: transform .05s ease, opacity .15s ease;
    }
    .primary-card:active { transform: translateY(1px); }
    .primary-card[aria-disabled="true"] {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .primary-card .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255,255,255,.18);
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
    }
    .primary-card .title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .primary-card .desc {
      font-size: 12px;
      margin: 2px 0 0 0;
      opacity: .95;
      line-height: 1.4;
    }
    .hint {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #111827;
      font-size: 12px;
      line-height: 1.55;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      opacity: .85;
    }
  </style>
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
  <header class="ms-welcome__header ms-bgColor-neutralLighter">
    <img width="90" height="90" src="../../assets/logo-filled.png" alt="Logo" title="Logo" />
    <h1 class="ms-font-su">表記整形</h1>
  </header>

  <section id="sideload-msg" class="ms-welcome__main">
    <h2 class="ms-font-xl">
      Please
      <a
        target="_blank"
        href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing"
        >sideload</a
      >
      your add-in to see app body.
    </h2>
  </section>

  <main id="app-body" class="ms-welcome__main" style="display:none;">
    <div class="hint">
      ① Word本文で整形したい文字を<strong>ドラッグで選択</strong><br/>
      ② 下の青いボタンを押す
    </div>

    <!-- 押す場所が一目でわかる “でかい青ボタン” -->
    <div
      id="btnFormatSelection"
      class="primary-card"
      role="button"
      tabindex="0"
      aria-disabled="true"
      title="Word本文で文字を選択すると有効になります"
      style="margin-top: 12px;"
    >
      <div class="icon">✨</div>
      <div>
        <p class="title">選択範囲を整形</p>
        <p class="desc">全角英数字→半角 / 半角ｶﾀｶﾅ→全角 / ｰ→ー</p>
      </div>
    </div>

    <p class="status" id="format-status">本文で文字を選択すると、ボタンが有効になります。</p>

    <hr style="margin: 14px 0;" />

    <details>
      <summary style="cursor:pointer; font-size:12px;">整形ルール（詳細）</summary>
      <div style="font-size:12px; line-height:1.6; margin-top:8px;">
        ・全角英数字/記号 → 半角<br />
        ・全角スペース → 半角スペース<br />
        ・半角ｶﾀｶﾅ → 全角カタカナ（濁点/半濁点対応）<br />
        ・半角長音「ｰ」 → 「ー」<br />
      </div>
    </details>
  </main>
</body>
</html>
